apiVersion: apps/v1
kind: Deployment
metadata: 
  name: phpmyadmin
  namespace: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
        net-backend: "true"
        net-frontend: "true"
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin:5.2.3-apache
        ports:
        - containerPort: 80
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: wp-secrets, key: ROOT_PWD } }
        - name: PMA_HOST
          value: database-svc
        - name: PMA_PORT
          value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-svc
  namespace: wordpress
spec:
  type: ClusterIP
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 80


