apiVersion: apps/v1
kind: Deployment
metadata: 
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
        net-backend: "true"
        net-frontend: "true"
    spec:
      volumes:
      - name: wordpress-data
        persistentVolumeClaim:
          claimName: wordpress-pvc
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z database 3306; do echo waiting for database; sleep 2; done;"]
      containers:
      - name: wordpress
        image: wordpress:latest
        ports:
        - containerPort: 80
        env:
        - name: WORDPRESS_DB_HOST
          value: database
        - name: WORDPRESS_DB_USER
          valueFrom: { secretKeyRef: { name: wp-secrets, key: WP_USER } }
        - name: WORDPRESS_DB_PASSWORD
          valueFrom: { secretKeyRef: { name: wp-secrets, key: WP_PASSWORD } }
        - name: WORDPRESS_DB_NAME
          valueFrom: { secretKeyRef: { name: wp-secrets, key: WP_DB } }
        volumeMounts:
        - name: wordpress-data
          mountPath: /var/www/html
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: wordpress
spec:
  type: LoadBalancer
  selector:
    app: wordpress
  ports:
  - port: 80
    targetPort: 80


