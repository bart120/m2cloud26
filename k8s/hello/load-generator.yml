apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: test
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            wget -q -O /dev/null http://nginx-service
          done