networks:
  frontend:
    name: frontend-network
  backend:
    name: backend-network
    external: false

services:
  # docker run --name:db -d -p 3306:3306 -e MYSQL_ROOT_PASSWORD=bob -e MYSQL_DATABASE=wordpress 
  # -e MYSQL_USER=toto -e MYSQL_PASSWORD=toto mysql:latest
  database:
    container_name: db
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=bob
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=toto
      - MYSQL_PASSWORD=toto
    networks:
      - backend

  myadmin:
    container_name: phpmyadmin
    image: phpmyadmin:5.2.3-apache
    ports:
      - "8080:80"
    environment:
      - MYSQL_ROOT_PASSWORD=bob
      - PMA_HOST=database
      - PMA_PORT=3306
    depends_on:
      - database
    networks:
      - frontend
      - backend
